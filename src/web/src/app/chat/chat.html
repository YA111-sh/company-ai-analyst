<p>chat works!</p>
<div class="chat">
  <div class="messages">
    <div *ngFor="let m of messages" class="message" [class.user]="m.role === 'user'">
      <div class="bubble">
        <pre>{{ m.text }}</pre>

        <img
          *ngIf="m.response?.report?.includes('.png')"
          [src]="extractImageUrl(m.response!.report)"
          class="chart-image"
        />

        <details *ngIf="m.response as r">
          <summary>Data used ({{ r.verified ? 'verified' : 'NOT verified' }})</summary>
          <pre>{{ r.tool_calls | json }}</pre>
        </details>
      </div>
    </div>

    <div *ngIf="loading" class="message">
      <div class="bubble">Thinking…</div>
    </div>
  </div>

  <div class="input-row">
    <input
      [(ngModel)]="input"
      (keyup.enter)="send()"
      placeholder="Ask about the company data…"
    />
    <button (click)="send()" [disabled]="loading">Send</button>
  </div>
</div>
